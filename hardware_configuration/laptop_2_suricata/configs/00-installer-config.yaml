# located @ /etc/netplan/00-installer-config.yaml

network:
  ethernets:
    enp0s31f6:
      dhcp4: false
      dhcp6: false
      match:
        macaddress: 8c:04:ba:0a:b6:7d
      set-name: enp0s31f6
      addresses:
        - 192.168.1.189/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [192.168.1.1]
  version: 2
  wifis: {}
